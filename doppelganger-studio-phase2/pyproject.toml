[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doppelganger-studio-phase2"
version = "0.1.0"
description = "DOPPELGANGER STUDIO Phase 2: AI Creative Engine & Research System (Wikipedia/TMDB/IMDB research, Claude-driven analysis, Postgres/MongoDB/Redis persistence)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "DOPPELGANGER STUDIO"}
]

dependencies = [
    # Research scrapers (src/services/research/*) -- aiohttp used by root's
    # real wikipedia_scraper.py; Wikipedia-API is the PyPI distribution name
    # for the wikipediaapi import (matches root pyproject.toml pin).
    "aiohttp>=3.12.15",
    "beautifulsoup4>=4.14.2",
    "Wikipedia-API>=0.8.1",
    "requests>=2.32.5",

    # Database layer (src/services/database/{postgres,mongodb,redis_cache}.py)
    "asyncpg>=0.29.0",
    "motor>=3.3.2",
    "redis>=5.0.1",

    # AI clients (src/services/ai/claude_client.py) -- No-OpenAI policy:
    # "openai" intentionally omitted, matching root repo's 2026-07-02
    # migration (commit fb6cad4) that dropped openai in favor of a local
    # Ryzanstein-gateway-backed fallback client.
    "anthropic>=0.69.0",

    # Config / models
    "pydantic>=2.11.10",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "black>=25.9.0",
    "flake8>=7.3.0",
    "mypy>=1.18.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
