"""
Wikipedia scraper for extracting TV show data.

This module implements the WikipediaResearchScraper class to fetch and parse
TV show information from Wikipedia. It includes methods for basic data extraction
and handling page variations.

Key components:
- WikipediaShowData: Dataclass for structured show data.
- WikipediaResearchScraper: Class for async scraping and data extraction.

Example:
    >>> async with WikipediaResearchScraper() as scraper:
    >>>     show_data = await scraper.fetch_show_data("I Love Lucy")
    >>>     print(show_data.title)

Copyright (c) 2025. All Rights Reserved. Patent Pending.
"""

from typing import List, Optional
from dataclasses import dataclass
import wikipediaapi
import asyncio
import logging

logger = logging.getLogger(__name__)

@dataclass
class WikipediaShowData:
    """
    Data structure for storing TV show information from Wikipedia.

    Attributes:
        title: The title of the show.
        summary: A brief summary of the show.
        years: The original airing years.
        network: The network that aired the show.
        genre: List of genres associated with the show.
        main_characters: List of main characters in the show.
    """
    title: str
    summary: str
    years: str
    network: str
    genre: List[str]
    main_characters: List[str]